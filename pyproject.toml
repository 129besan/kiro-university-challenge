[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "changelens"
version = "0.1.0"
description = "Human-readable comparison of old and new documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit==1.65.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.3"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
